repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--strict, src/]
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.5.2
          - typer>=0.12.5
          - fastapi>=0.115.0
          - httpx>=0.27.2
          - polars>=1.9.0
          - orjson>=3.10.7
          - tenacity>=9.0.0
          - structlog>=24.4.0
          - pytest>=8.3.3
