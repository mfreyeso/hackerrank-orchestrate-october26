[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "deletion-audit-agent"
version = "0.1.0"
description = "Deterministic-core + LangGraph deletion audit agent for Northstar Shop (Ghost Data Still Exists)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.10",
    "langchain-anthropic>=0.2.3",
    "langchain-openai>=0.2.2",
    "typer>=0.12.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "httpx>=0.27.2",
    "polars>=1.9.0",
    "sqlglot>=25.24.0",
    "pypdf>=5.0.1",
    "pdfplumber>=0.11.4",
    "pymupdf>=1.24.11,<1.25.0",
    "cryptography>=43.0.0,<45.0.0",
    "pillow>=10.4.0",
    "orjson>=3.10.7",
    "diskcache>=5.6.3",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=4.0.1",
]

[project.scripts]
audit = "deletion_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deletion_audit"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["deletion_audit"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "diskcache.*",
    "pdfplumber.*",
    "fitz.*",
    "pypdf.*",
    "sqlglot.*",
    "pytesseract.*",
    "langgraph.*",
    "langchain_core.*",
    "langchain_anthropic.*",
    "langchain_openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
